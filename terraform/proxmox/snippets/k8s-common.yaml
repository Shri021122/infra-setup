#cloud-config
# Generic first-boot prep for any Kubernetes node running on a Proxmox VM.
#
# This file is uploaded ONCE per Proxmox host by an admin (web UI: Datacenter
# → Storage → local → Snippets → Upload; or scp to /var/lib/vz/snippets/).
# Terraform then references it as user_data_file_id without ever touching SSH.
#
# Per-cluster bits (SSH key, hostname, IP/DNS, user account) are NOT here —
# they're injected via the Proxmox API's initialization{} blocks per VM.
#
# Final path on Proxmox: /var/lib/vz/snippets/k8s-common.yaml
# File ID for Terraform:  local:snippets/k8s-common.yaml

# Grow root partition+filesystem to fill the disk BEFORE installing/upgrading
growpart:
  mode: auto
  devices: ["/"]
  ignore_growroot_disabled: false

resize_rootfs: true

# Update apt cache but DO NOT dist-upgrade on first boot — that fills the small
# base image before growpart finishes. Upgrade separately after first boot.
package_update: true
package_upgrade: false

packages:
  - curl
  - wget
  - vim
  - htop
  - net-tools
  - nfs-common
  - open-iscsi
  - cryptsetup
  - jq
  - unzip
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - qemu-guest-agent
  - chrony

write_files:
  - path: /etc/chrony.conf
    content: |
      pool 2.ubuntu.pool.ntp.org iburst
      driftfile /var/lib/chrony/drift
      makestep 1.0 3
      rtcsync
      logdir /var/log/chrony

runcmd:
  - systemctl enable --now qemu-guest-agent
  - systemctl enable --now chrony
  - systemctl disable --now ufw
  - swapoff -a
  - sed -i '/swap/d' /etc/fstab

final_message: "Cloud-init complete after $UPTIME seconds"
