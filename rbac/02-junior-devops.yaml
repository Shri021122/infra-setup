################################################################################
# RBAC: junior-devops
# Read/write on workloads and config; no secrets, no RBAC, no node access.
################################################################################
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: junior-devops
  labels:
    rbac.rke2.io/managed: "true"
    team: devops
    level: junior
rules:
  # Read nodes (for debugging node issues)
  - apiGroups: [""]
    resources: ["nodes", "nodes/status"]
    verbs: ["get", "list", "watch"]

  # Workload management (no exec on prod)
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
      - events
      - namespaces
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # Pod exec allowed (staging/dev namespaces restricted via namespace-level role)
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]

  # NO access to secrets (junior devops uses ExternalSecrets)
  # secrets: intentionally omitted

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

  # Monitoring read access
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules", "podmonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: junior-devops-binding
  labels:
    rbac.rke2.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: junior-devops
subjects:
  - kind: Group
    name: junior-devops
    apiGroup: rbac.authorization.k8s.io
# NOTE: junior-devops is denied pods/exec in production by *not* granting it
# in the cluster-level ClusterRole above. Kubernetes RBAC is purely additive
# — there is no Role-based deny mechanism, so a Role with empty verbs is
# rejected by the API server.
