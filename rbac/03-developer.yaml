################################################################################
# RBAC: developer
# Scoped to development and staging namespaces only.
# No cluster-level access, no secrets, no production.
################################################################################
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: developer-base
  labels:
    rbac.rke2.io/managed: "true"
    team: engineering
rules:
  # Read-only cluster-wide (for tooling to discover namespaces etc.)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
# Namespace-scoped developer role (applied per namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: developer-namespace
  labels:
    rbac.rke2.io/managed: "true"
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - pods/exec
      - pods/portforward
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - events
      - serviceaccounts
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
# Bind developer-base cluster-wide (namespace-list only)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: developer-cluster-read
  labels:
    rbac.rke2.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: developer-base
subjects:
  - kind: Group
    name: developers
    apiGroup: rbac.authorization.k8s.io
---
# Bind full developer role to development namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-full-access
  namespace: development
  labels:
    rbac.rke2.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: developer-namespace
subjects:
  - kind: Group
    name: developers
    apiGroup: rbac.authorization.k8s.io
---
# Read-only in staging (developers can see staging but not modify)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-staging-read
  namespace: staging
  labels:
    rbac.rke2.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: developers
    apiGroup: rbac.authorization.k8s.io
