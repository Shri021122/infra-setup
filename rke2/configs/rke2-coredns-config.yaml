################################################################################
# CoreDNS HelmChartConfig — override the Corefile to resolve bare "kubernetes"
#
# Why:
#   kube-vip v0.7.2 hardcodes its apiserver URL as
#     https://kubernetes:<port>
#   relying on cluster DNS to resolve the bare hostname. CoreDNS by default
#   only resolves the FQDN (kubernetes.default.svc.cluster.local), so the
#   bare lookup fails and kube-vip can never win leader election or bind
#   the control-plane VIP.
#
# Fix:
#   Add a `hosts` plugin block to the Corefile mapping `kubernetes` to
#   every master node's direct IP. The apiserver listens on :6443 on each
#   master, and the apiserver TLS cert SAN includes DNS:kubernetes, so
#   `https://kubernetes:6443` connects and validates cleanly.
#
# The MASTER_IPS_PLACEHOLDER token is rewritten by install-master.sh with
# one "<ip> kubernetes" line per master.
################################################################################
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-coredns
  namespace: kube-system
spec:
  valuesContent: |-
    servers:
      - zones:
          - zone: .
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: hosts
            configBlock: |-
MASTER_IPS_PLACEHOLDER
              fallthrough
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods insecure
              fallthrough in-addr.arpa ip6.arpa
              ttl 30
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            parameters: 30
          - name: loop
          - name: reload
          - name: loadbalance
