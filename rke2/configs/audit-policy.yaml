################################################################################
# Kubernetes API Server Audit Policy
# Captures security-relevant events for compliance and threat detection
################################################################################
apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  # Never audit these noisy read-only calls
  - level: None
    verbs: ["get", "watch", "list"]
    resources:
      - group: ""
        resources: ["events"]
    users: ["system:kube-proxy"]

  # Don't audit kubelet reads
  - level: None
    users: ["system:nodes"]
    verbs: ["get"]
    resources:
      - group: ""
        resources: ["nodes", "nodes/status"]

  # Don't audit authenticated leader elections
  - level: None
    users:
      - system:kube-controller-manager
      - system:kube-scheduler
      - system:serviceaccount:kube-system:endpoint-controller
    verbs: ["get", "update"]
    namespaces: ["kube-system"]
    resources:
      - group: ""
        resources: ["endpoints"]

  # Audit secrets, configmaps, tokenreviews at Request level
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps"]
      - group: "authentication.k8s.io"
        resources: ["tokenreviews"]

  # Log persistent volume claim changes at RequestResponse
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["persistentvolumeclaims"]

  # Audit RBAC changes at full RequestResponse level
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "rbac.authorization.k8s.io"
        resources:
          - clusterroles
          - clusterrolebindings
          - roles
          - rolebindings

  # Audit pod exec/attach (potential breakout vector)
  - level: Request
    verbs: ["create"]
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward"]

  # Audit all write operations at Request level
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]

  # Log all reads at Metadata level for audit trail
  - level: Metadata
    verbs: ["get", "list", "watch"]

  # Catch-all: no logging for anything else
  - level: None
