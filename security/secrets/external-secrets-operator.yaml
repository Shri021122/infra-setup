################################################################################
# External Secrets Operator — Secrets Management
# Pulls secrets from Vault/AWS SSM/Azure KeyVault into Kubernetes Secrets.
# This avoids storing secrets in git or Terraform state.
#
# Install ESO first:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
################################################################################

---
# ClusterSecretStore — cluster-wide store backed by HashiCorp Vault
# Replace provider with AWS SSM or Azure KeyVault as needed.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    security.policy/type: secret-store
spec:
  provider:
    vault:
      server: "https://vault.YOUR_DOMAIN:8200"   # Set to your Vault URL
      path: "secret"
      version: "v2"
      auth:
        # Kubernetes auth method — use the cluster's service account
        kubernetes:
          mountPath: "kubernetes"
          role: "rke2-cluster"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
# ServiceAccount for ESO → Vault auth
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
---
# Example: pull DB credentials from Vault into production namespace
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: production
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: database-credentials    # Name of the Kubernetes Secret created
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Transform Vault fields into the format your app expects
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:5432/{{ .dbname }}"
        DB_USERNAME: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: production/database
        property: username
    - secretKey: password
      remoteRef:
        key: production/database
        property: password
    - secretKey: host
      remoteRef:
        key: production/database
        property: host
    - secretKey: dbname
      remoteRef:
        key: production/database
        property: dbname
---
# Example: pull monitoring credentials (Grafana admin password)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring/grafana
        property: admin_user
    - secretKey: admin-password
      remoteRef:
        key: monitoring/grafana
        property: admin_password
---
# Sealed Secrets alternative — for teams using GitOps without Vault
# Install: helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
# Usage: kubeseal --fetch-cert --controller-name=sealed-secrets --controller-namespace=kube-system
# Then: echo -n "mysecret" | kubeseal --raw --from-file=/dev/stdin --namespace production --name my-secret
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-management-readme
  namespace: kube-system
data:
  README: |
    Secrets Management Strategy:

    Option 1 (Recommended): External Secrets Operator + HashiCorp Vault
      - Secrets live in Vault, ESO syncs to K8s Secrets
      - Rotation happens in Vault, propagates automatically
      - Audit trail in Vault

    Option 2: Sealed Secrets (GitOps friendly)
      - Secrets encrypted in git, decrypted in cluster
      - Good for teams using ArgoCD/Flux
      - Key rotation requires re-sealing all secrets

    Option 3: Cloud-native (AWS SSM, Azure KeyVault, GCP Secret Manager)
      - Leverages existing cloud IAM
      - ESO supports all three as backends
