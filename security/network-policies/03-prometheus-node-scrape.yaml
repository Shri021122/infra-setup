################################################################################
# CiliumNetworkPolicy — allow Prometheus to scrape host-network metrics
# endpoints on every dealing node (kubelet, KCM, scheduler, etcd-metrics,
# cilium-agent, cilium-operator, hubble-metrics).
#
# Why this can't be a plain K8s NetworkPolicy:
#   K8s NetworkPolicy `ipBlock` rules in Cilium only match the `cidr` identity
#   used for truly-external IPs. Cluster node IPs carry the `host` /
#   `remote-node` / `kube-apiserver` Cilium reserved identities and are NOT
#   matched by ipBlock. The only way to allow pod-to-node-IP traffic in Cilium
#   is via `toEntities`, which is Cilium-specific.
#
# This policy STACKS on top of the existing K8s NetworkPolicy
# `prometheus-allow-scrape` — both must permit a flow for it to be forwarded.
# The K8s policy already permits these ports via the more-general
# "namespaceSelector: {}" rule for pod-targeted scrapes; this CCNP just
# extends that to traffic destined to node IPs (host / remote-node identities).
################################################################################
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-allow-node-scrape
  namespace: monitoring
  labels:
    purpose: platform-baseline
    description: prometheus-can-scrape-host-network-metrics-on-every-node
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  egress:
    - toEntities:
        - host          # the node Prometheus runs on (its own host IP)
        - remote-node   # every other Cilium-managed cluster node
        - kube-apiserver  # masters (already covered by allow-pods-to-kube-apiserver, restated for clarity)
      toPorts:
        - ports:
            - port: "10250"   # kubelet (+ /metrics/cadvisor, /metrics/probes)
              protocol: TCP
            - port: "10257"   # kube-controller-manager
              protocol: TCP
            - port: "10259"   # kube-scheduler
              protocol: TCP
            - port: "2381"    # etcd metrics (etcd-expose-metrics: true)
              protocol: TCP
            - port: "9962"    # cilium-agent
              protocol: TCP
            - port: "9963"    # cilium-operator
              protocol: TCP
            - port: "9964"    # cilium-envoy (IngressController admin metrics)
              protocol: TCP
            - port: "9965"    # hubble-metrics
              protocol: TCP
