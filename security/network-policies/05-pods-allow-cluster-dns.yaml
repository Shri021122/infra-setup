################################################################################
# CiliumClusterwideNetworkPolicy — allow every pod to reach the in-cluster
# DNS service (CoreDNS) on UDP/TCP port 53.
#
# Backstory:
#   - The platform-baseline CCNP `allow-pods-to-kube-apiserver` selects all
#     pod endpoints (`k8s:io.kubernetes.pod.namespace Exists`) and allows
#     only egress to `kube-apiserver`. Default-deny kicks in for everything
#     else.
#   - Some namespaces have their own `allow-dns-egress` NetworkPolicy
#     (production, staging, development) — those work fine.
#   - Other namespaces (cert-manager, argocd, external-secrets, monitoring,
#     cilium-secrets, kube-system internal pods) DON'T have a DNS-allow
#     policy. Their pods can't resolve service names — which means
#     cert-manager can't talk to issuers via DNS, ArgoCD can't pull from
#     Git via DNS, etc.
#
#   Hubble flow log confirmed:
#     cert-manager/cert-manager-... → kube-system/rke2-coredns-...:53
#       Policy denied DROPPED (UDP)
#
# Fix:
#   A cluster-wide CCNP that allows every pod endpoint to egress on UDP/53
#   and TCP/53 to the CoreDNS service endpoints (label
#   `k8s-app: kube-dns` in `kube-system`). This is foundational
#   infrastructure — DNS is needed by virtually every workload.
#
# Security note:
#   This is the standard "default" for Kubernetes clusters. The narrowness
#   is in the destination (CoreDNS pods only, port 53 only) — not the
#   source. A compromised pod can already use DNS for exfiltration via
#   CoreDNS, but only because CoreDNS can forward to upstream (see
#   `04-coredns-allow-upstream-dns.yaml`). To tighten the exfil vector,
#   limit *that* policy, not this one.
################################################################################
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-pods-to-cluster-dns
  labels:
    purpose: platform-baseline
    description: every-pod-can-reach-CoreDNS
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: Exists
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
