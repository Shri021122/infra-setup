################################################################################
# CiliumClusterwideNetworkPolicy — platform baseline: allow workload pods to
# reach the kube-apiserver.
#
# History:
#   - Originally created live via `kubectl apply` (not committed). Captured
#     into IaC here on the same day we discovered it was breaking the Cilium
#     IngressController.
#   - The original used `endpointSelector: {}`. In Cilium, `{}` matches every
#     endpoint identity — INCLUDING reserved identities like `ingress`, `host`,
#     `world`, `remote-node`, `kube-apiserver` itself. The moment any policy
#     with an egress rule selects an endpoint, that endpoint enters
#     default-deny egress mode. Result: the IngressController (Envoy, source
#     identity `ingress`) was only allowed to talk to kube-apiserver, so every
#     other Ingress backend (argocd-server, hubble-ui, future apps) returned
#     HTTP 403 "Access denied" at the Envoy layer.
#
# Fix:
#   Use a selector that matches every real-pod endpoint but NOT reserved
#   identities. Real pods always carry the `k8s:io.kubernetes.pod.namespace`
#   label (Cilium injects it from the pod's namespace). Reserved identities
#   do not. So `matchExpressions: [namespace Exists]` cleanly scopes the
#   policy to workloads only.
################################################################################
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-pods-to-kube-apiserver
  labels:
    purpose: platform-baseline
    description: every-pod-can-reach-the-api-server
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: Exists
  egress:
    - toEntities:
        - kube-apiserver
