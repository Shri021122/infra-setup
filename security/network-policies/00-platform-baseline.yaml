################################################################################
# CCNP-1 — Platform baseline ALLOW egress (additive).
#
# Every pod in every namespace (including ones created later by the DevOps
# team) automatically gets these allowances:
#   - reach the kube-apiserver (RBAC still gates what it can actually do)
#   - reach any other pod/service in the cluster (cross-namespace)
#   - reach the host network of this and other nodes (kubelet:10250, etcd:2381,
#     kube-controller-manager:10257, kube-scheduler:10259, prometheus scrapes,
#     etc.)
#   - resolve DNS via CoreDNS
#
# enableDefaultDeny.egress=false is critical: without it, this CCNP would
# force default-deny egress on every endpoint it selects (i.e. every pod),
# silently breaking new namespaces.
#
# Tenant isolation between namespaces is NOT enforced here — pods in
# webtrade can talk to pods in crm by default. If a specific app needs
# stricter rules, the app team writes a per-app CiliumNetworkPolicy in
# their own namespace with enableDefaultDeny.egress=true.
################################################################################
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: platform-baseline-egress
  labels:
    purpose: platform-baseline
    description: every-pod-can-reach-cluster-internals-and-DNS
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: Exists
  enableDefaultDeny:
    egress: false
  egress:
    # Anything inside the cluster — pods, services, nodes, the apiserver
    - toEntities:
        - cluster
        - kube-apiserver
        - host
        - remote-node
    # DNS lookups
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
