################################################################################
# Network Policies — Monitoring Stack
#
# Prometheus (agent mode) runs in-cluster and remote_writes to a central Mimir.
# Grafana, Loki and Mimir themselves are external; Alloy runs as systemd on
# each VM (not a pod) so it isn't governed by NetworkPolicy.
#
# In-cluster scrapes (cilium-agent, hubble, argocd, kubelet on node IPs, etc.)
# are allowed by the `platform-baseline-egress` CCNP via toEntities:
# cluster,host,remote-node. This NetworkPolicy only adds rules for EXTERNAL
# targets the CCNP doesn't cover — primarily the central Mimir endpoint.
#
# MIMIR_IP_PLACEHOLDER and MIMIR_PORT_PLACEHOLDER are substituted at deploy
# time by scripts/deploy.sh from central_mimir_url in observability.tfvars.
################################################################################
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-allow-scrape
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
    - Ingress
  egress:
    # Scrape every in-cluster pod across all namespaces
    - to:
        - namespaceSelector: {}
    # Central Mimir endpoint (remote_write) — substituted by deploy.sh
    - to:
        - ipBlock:
            cidr: MIMIR_IP_PLACEHOLDER/32
      ports:
        - port: MIMIR_PORT_PLACEHOLDER
          protocol: TCP
    # Outbound HTTPS — webhooks, Mimir/Loki behind TLS termination, etc.
    - ports:
        - port: 443
          protocol: TCP
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
  ingress:
    # Pods labelled prometheus.io/access=true may query Prometheus directly
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              prometheus.io/access: "true"
      ports:
        - port: 9090
